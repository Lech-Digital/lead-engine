# The whole business lives in this file. One config = one client = one niche.
# Copy it per client (config.acme.yaml) and run with --config.

client:
  name: "Acme Recruiting Software"
  # What your CLIENT sells. The AI pitches THIS to the leads it finds.
  offer: >
    Acme is an applicant-tracking system that cuts time-to-hire for HR teams by 40%
    with AI-screened candidate shortlists.
  sender_name: "Andrzej"
  sender_title: "Founder, Acme"

# The niche you're hunting. Leads must match the intent of these.
niche:
  description: "B2B companies actively hiring HR / People / Talent leaders (a buying signal for HR software)"
  # Keywords that indicate the RIGHT KIND of company / role.
  target_keywords:
    - "HR"
    - "People Operations"
    - "Talent"
    - "Recruiting"
    - "Head of People"
    - "HR Director"
  # Phrases that indicate ACTIVE BUYING INTENT / pain right now.
  buying_signals:
    - "hiring"
    - "looking for"
    - "we're growing"
    - "scaling our team"
    - "frustrated with"
    - "switching from"
    - "raised"
    - "seed"
    - "series a"
  # Hard NO conditions. The AI marks these NO even when keywords match — this is what
  # keeps competitors and forum noise out of your outreach list.
  disqualifiers:
    - "The company sells recruiting, ATS, HR, hiring, or onboarding software itself (a competitor, not a buyer)"
    - "An anonymous forum/comment author sharing an opinion or venting, who is not a named decision-maker at an identifiable company looking to buy"
    - "A job seeker, candidate, recruiter-for-hire, or someone applying for a role"
    - "Someone criticising or distrustful of AI-based hiring/screening tools (a poor fit for an AI pitch)"
  # Likely decision-maker titles. Used to target the contact-research links per lead.
  buyer_titles:
    - "Head of People"
    - "Head of Talent"
    - "VP People"
    - "Talent Acquisition Lead"

sources:
  hackernews:
    enabled: true
    # Searched against the official HN Algolia API (no key, allowed).
    queries:
      - "head of people"
      - "hiring HR"
      - "people operations"
    max_per_query: 30
    # Only consider posts from the last N hours so you re-run without dupes piling up.
    lookback_hours: 168
    # HN comments are opinion-heavy and the lowest-intent source: multiply their score
    # so real open roles / funding rounds are enriched and reviewed first. Lower = more demoted.
    score_weight: 0.7

  greenhouse:
    # Public Greenhouse job boards. Each entry is the board token from
    # boards.greenhouse.io/<token>. An open role matching target_keywords = buying signal.
    enabled: true
    boards:
      - "stripe"
      - "gitlab"

  lever:
    # Public Lever postings. Each entry is the company slug from jobs.lever.co/<slug>.
    enabled: false
    companies:
      - "leadengine-example"

  funding:
    # Funding-announcement RSS/Atom feeds. A fresh round is the strongest buying
    # signal we harvest: the company is about to hire and re-tool. Because the
    # announcement text carries no niche keywords, base_score floors its relevance
    # so it survives the scoring gate; AI enrichment then qualifies fit per niche.
    enabled: true
    feeds:
      - "https://techcrunch.com/category/venture/feed/"
    # Only consider rounds announced in the last N days.
    lookback_days: 30
    max_per_feed: 50
    # Intrinsic relevance (0.0-1.0). 0.5 = clears the default min_score of 0.4 on its
    # own; raise toward 1.0 to prioritise funded companies above keyword-matched ones.
    base_score: 0.5

scoring:
  # A lead is kept only if its signal score clears this (0.0 - 1.0).
  min_score: 0.4

output:
  sqlite_path: "leads.db"
  csv_path: "leads.csv"

delivery:
  # One client = one Slack channel. Name the env var that holds this client's webhook
  # (keeps the secret out of the committed config). `leadengine new <client>` wires a
  # distinct SLACK_WEBHOOK_<CLIENT> per scaffolded client automatically.
  slack:
    enabled: true
    webhook_env: "SLACK_WEBHOOK_URL"
  # Outreach is NEVER automatic. A YES lead enters a review queue (`leadengine queue`);
  # you approve it with the real recipient address (`approve <id> --email ...`), then
  # `leadengine send` delivers via this provider. Start with provider: dryrun ($0, no
  # external calls) and switch to resend once you have a sending identity + API key.
  email:
    enabled: true
    provider: "dryrun"          # dryrun | resend | none
    from_addr: "andrzej@acme.com"
    from_name: "Andrzej"
    api_key_env: "RESEND_API_KEY"   # secret stays in .env, not here
