# Coldstart selling Coldstart — dogfooding the engine to find its own first clients.
# niche = B2B companies investing in outbound / needing pipeline.

client:
  name: "Coldstart"
  offer: >
    Coldstart is a done-for-you lead engine. Every morning it finds B2B companies
    showing a buying signal right now — hiring sales reps, fresh funding, scaling
    outbound — qualifies them strictly, and writes the first outreach email. You
    approve and it sends. Qualified leads with drafts in your inbox daily; one flat
    monthly fee, cancel anytime.
  sender_name: "Andrzej"
  sender_title: "Founder, Coldstart"

niche:
  description: >
    B2B companies actively investing in outbound sales and needing more qualified
    pipeline: recently funded startups scaling go-to-market, companies hiring
    SDRs / BDRs / AEs / Heads of Sales or Growth, B2B agencies and consultancies,
    and solo founders or small SaaS teams doing their own outreach.
  target_keywords:
    - "SDR"
    - "BDR"
    - "sales development"
    - "account executive"
    - "head of sales"
    - "head of growth"
    - "VP Sales"
    - "demand generation"
    - "outbound"
    - "pipeline"
    - "go-to-market"
  buying_signals:
    - "hiring"
    - "we're growing"
    - "scaling"
    - "raised"
    - "seed"
    - "series a"
    - "looking for"
    - "founder"
  disqualifiers:
    - "The company itself sells lead generation, sales-outreach, prospecting, appointment-setting, or cold-email software/services (a direct competitor)"
    - "An anonymous forum/comment author venting or sharing an opinion, not a named decision-maker at an identifiable company"
    - "A job seeker or candidate looking for a role"
    - "A large enterprise with an established outbound team unlikely to buy from a solo operator"
  buyer_titles:
    - "Founder"
    - "Head of Sales"
    - "Head of Growth"
    - "VP Sales"
    - "CEO"

sources:
  hackernews:
    enabled: true
    queries:
      - "hiring sales development"
      - "hiring BDR"
      - "head of growth"
      - "outbound sales"
      - "we are hiring sales"
    max_per_query: 30
    lookback_hours: 336
    score_weight: 0.7
  greenhouse:
    enabled: false
    boards: []
  lever:
    enabled: false
    companies: []
  funding:
    enabled: true
    feeds:
      - "https://techcrunch.com/category/venture/feed/"
    lookback_days: 30
    max_per_feed: 50
    base_score: 0.5
    require_funding_terms: true

scoring:
  min_score: 0.4
  max_enrich_per_run: 40

output:
  sqlite_path: "data/coldstart.db"
  csv_path: "data/coldstart.csv"

delivery:
  slack:
    enabled: false
  email:
    enabled: false
