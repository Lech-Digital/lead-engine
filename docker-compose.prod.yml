# Production stack for getcoldstart.nl — app + Postgres + Caddy (auto-HTTPS).
# Run on the server with:
#   docker compose --env-file deploy/.env.prod -f docker-compose.prod.yml up -d --build
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: coldstart
      POSTGRES_USER: coldstart
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env.prod}
    volumes:
      - coldstart-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coldstart -d coldstart"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Coldstart: "Host=db;Port=5432;Database=coldstart;Username=coldstart;Password=${POSTGRES_PASSWORD}"
      # Persist Data Protection keys so invite/reset links + login cookies survive redeploys.
      DataProtection__KeyPath: /app/keys
      # Transactional email (Resend SMTP). Values come from deploy/.env.prod.
      Smtp__Host: ${SMTP_HOST:-smtp.resend.com}
      Smtp__Port: ${SMTP_PORT:-465}
      Smtp__Username: ${SMTP_USERNAME:-resend}
      Smtp__Password: ${SMTP_PASSWORD:?set SMTP_PASSWORD (Resend API key) in deploy/.env.prod}
      Smtp__FromName: ${SMTP_FROM_NAME:-Coldstart}
      Smtp__FromAddress: ${SMTP_FROM_ADDRESS:-noreply@getcoldstart.nl}
      # Admin mailbox (IMAP/SMTP inbox view). Soft-degrade: no hard-fail guard here —
      # until these are set in deploy/.env.prod the app starts fine and the admin
      # mailbox panel simply shows "Mailbox unreachable" instead of crashing.
      Mailbox__Host: ${MAILBOX_HOST:-}
      Mailbox__Username: ${MAILBOX_USERNAME:-}
      Mailbox__Password: ${MAILBOX_PASSWORD:-}
      # "Polish with AI" (Groq). Soft-degrade: no hard-fail guard — until this is set
      # in deploy/.env.prod the button just shows "Couldn't polish just now".
      Llm__ApiKey: ${LLM_API_KEY:-}
      # Stripe billing. Soft-degrade: with these unset, checkout/portal redirect back
      # to /app with a notice and the webhook rejects everything (bad signature).
      Stripe__SecretKey: ${STRIPE_SECRET_KEY:-}
      Stripe__WebhookSecret: ${STRIPE_WEBHOOK_SECRET:-}
      Stripe__PriceMonthlyId: ${STRIPE_PRICE_MONTHLY_ID:-}
      Stripe__PriceSetupId: ${STRIPE_PRICE_SETUP_ID:-}
      # Branded "Send from Coldstart" (admin-only outreach send). Soft-degrade: unset →
      # the send fails with a notice; draft/handoff sending is unaffected.
      OutreachMailbox__Host: ${OUTREACH_HOST:-}
      OutreachMailbox__Username: ${OUTREACH_USERNAME:-}
      OutreachMailbox__Password: ${OUTREACH_PASSWORD:-}
    volumes:
      - coldstart-dpkeys:/app/keys
    expose:
      - "8080"

  db-backup:
    image: postgres:17
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      # Host-bound so dumps sit as plain files, easy to copy off the server.
      - ./backups:/backups
    entrypoint:
      - bash
      - -c
      - |
        while true; do
          ts=$$(date -u +%F-%H%M)
          if pg_dump -h db -U coldstart -d coldstart -Fc -f "/backups/coldstart-$$ts.dump"; then
            echo "backup ok: coldstart-$$ts.dump"
            find /backups -name 'coldstart-*.dump' -mtime "+$$RETENTION_DAYS" -delete
          else
            echo "backup FAILED at $$ts" >&2
          fi
          sleep 86400
        done

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  coldstart-pgdata:
  coldstart-dpkeys:
  caddy-data:
  caddy-config:
